
trigger:
  - UAT

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: SONAR_PROJECT
- group: VercelVariables-UAT
- group: BACKEND_API_URL

steps:

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'


- script: |
    npm ci
  displayName: 'Install dependencies'


- script: |
    npx sonarqube-scanner \
      -Dsonar.projectKey=$(SONAR_PROJECT_KEY) \
      -Dsonar.organization=$(SONAR_ORG) \
      -Dsonar.login=$(SONAR_TOKEN) \
      -Dsonar.host.url=https://sonarcloud.io \
      -Dsonar.sources=. \
      -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/build/**,**/public/**,**/coverage/**,**/*.config.js,**/*.config.mjs,**/next-env.d.ts \
      -Dsonar.tests=. \
      -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
  displayName: 'Run SonarCloud Scan'


- script: |
    npm install -g vercel
    vercel deploy --prod --token=$(VERCEL_TOKEN) --yes
  env:
    VERCEL_ORG_ID: $(VERCEL_ORG_ID)
    VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
    NEXT_PUBLIC_API_URL: $(UAT)
  displayName: 'Deploy to Vercel Production'